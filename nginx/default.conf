# Frontend container: serves the built React app, and hands crawlers to the
# API's server-rendered HTML.
#
# This file is bind-mounted from the server's checkout (see docker-compose.yml),
# so the copy baked into the image is NOT what runs — changes here need a
# `git pull` on the server, unlike JS changes, which Watchtower picks up on its
# own. DEPLOY-SEO.md has the sequence.
#
# The TLS-terminating nginx in front of this one is not in this repo. gzip and
# Cache-Control belong there too, on the responses it proxies — the block in
# DEPLOY-SEO.md is written to be pasted into it.

# Which requests get server-rendered HTML instead of the empty app shell.
#
# The app is client-rendered: without this, every URL answers with the same
# 1.4 KB <div id="root"></div>, and a crawler that does not execute JavaScript —
# which is most of them, Yandex included — sees a site with no content and no
# links on any page.
#
# Bots only. A browser gets the app exactly as before, and the HTML the bots get
# is built from the same database rows the app renders, so the two agree. That
# distinction is what separates dynamic rendering from cloaking.
map $http_user_agent $is_crawler {
    default 0;
    "~*(googlebot|google-inspectiontool|bingbot|yandex|duckduckbot|baiduspider|applebot|petalbot)" 1;
    "~*(telegrambot|vkshare|whatsapp|twitterbot|facebookexternalhit|slackbot|discordbot|skypeuripreview)" 1;
}

server {
    listen       80;
    listen  [::]:80;
    # teaform.online used to be served here as well, byte-identical and with no
    # canonical — two domains claiming the same pages, which is a duplicate a
    # search engine has to resolve by guessing. It now redirects (below).
    server_name  localhost teaform.ru;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS, and the backend behind a variable rather than a
    # literal. With a literal, nginx resolves the name once at startup and
    # refuses to start at all if the API container is not up yet — which on a
    # reboot or a Watchtower restart would take the whole site down, not just
    # the crawler path. A variable defers resolution to the request.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api "tea-backend:3001";

    # ^~ so this wins over the asset regex below and keeps its cache headers:
    # hashed filenames never change contents, so they never need revalidating.
    location ^~ /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The shell names the current bundle hashes, so it is the one file that must
    # never be cached — a stale copy points at bundles that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Both engines look for the sitemap at the domain root first. Only
    # /api/sitemap.xml answered before, which robots.txt had to point at.
    location = /sitemap.xml {
        proxy_pass http://$api/sitemap.xml;
        proxy_set_header Host $host;
    }

    location = /robots.txt {
        add_header Cache-Control "public, max-age=3600";
    }

    # A request for a file that does not exist is a 404, not the app shell.
    #
    # `try_files $uri /index.html` below is right for the app's own routes and
    # wrong for everything else: with `error_page 404 /index.html` on top of it,
    # no URL on this domain could ever fail, so every typo, every dead link and
    # every probe for /wp-login.php became another page answering 200 with the
    # site's default title. Anything shaped like an asset now 404s properly.
    location ~* \.(js|mjs|css|map|png|jpe?g|gif|webp|svg|ico|woff2?|ttf|eot|json|xml|txt|webmanifest)$ {
        try_files $uri =404;
    }

    # The public pages. Crawlers are proxied to the API's rendered HTML; every
    # other request gets the app.
    location / {
        if ($is_crawler) {
            proxy_pass http://$api/render$uri$is_args$args;
        }
        try_files $uri /index.html;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}

# One canonical host. Anything else that resolves here is redirected rather than
# answered, so a page is never reachable at two addresses.
server {
    listen       80;
    listen  [::]:80;
    server_name  teaform.online www.teaform.ru www.teaform.online;
    return 301 https://teaform.ru$request_uri;
}
