<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" type="image/x-icon" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- The mobile address bar and the PWA splash take this colour. #000000 was
         the Create React App default and matched nothing on the site. -->
    <meta name="theme-color" content="#1d5c41" />

    <!-- Defaults only. Any page with something better to say overrides these
         through react-helmet (PageMeta.jsx) — a tasting sets its own title,
         description and preview image, which is what a link posted to Telegram
         or VK actually shows. -->
    <title>Форма чая — дневник чайных дегустаций</title>
    <!-- data-react-helmet on the defaults below is load-bearing: without it
         react-helmet appends a second description/og:* instead of replacing
         these, and a crawler reading the first one gets the site default on
         every tasting page. -->
    <meta
      data-react-helmet="true"
      name="description"
      content="Дневник чайных дегустаций: аромат, вкус и проливы, фото и голосовые заметки. Ведите свои записи и читайте дегустации других."
    />

    <meta data-react-helmet="true" property="og:type" content="website" />
    <meta data-react-helmet="true" property="og:site_name" content="Форма чая" />
    <meta data-react-helmet="true" property="og:locale" content="ru_RU" />
    <meta data-react-helmet="true" property="og:url" content="https://teaform.ru/" />
    <meta data-react-helmet="true" property="og:title" content="Форма чая — дневник чайных дегустаций" />
    <meta
      data-react-helmet="true"
      property="og:description"
      content="Дневник чайных дегустаций: аромат, вкус и проливы, фото и голосовые заметки."
    />
    <meta data-react-helmet="true" property="og:image" content="https://teaform.ru/logo512.png" />
    <meta data-react-helmet="true" name="twitter:card" content="summary_large_image" />

    <meta name="yandex-verification" content="56c39326587125eb" />
    <meta name="yandex-verification" content="3d5917344191772e" />

    <!-- @context must be schema.org. Pointing it at the site's own domain made
         the block unparseable, so no search engine has ever read it. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Форма чая",
        "url": "https://teaform.ru/",
        "inLanguage": "ru-RU",
        "description": "Дневник чайных дегустаций",
        "publisher": {
          "@type": "Organization",
          "name": "Форма чая",
          "url": "https://teaform.ru/",
          "logo": "https://teaform.ru/logo512.png"
        }
      }
    </script>
  </head>
  <body>
    <noscript>Для работы «Формы чая» нужен включённый JavaScript.</noscript>
    <div id="root"></div>
  </body>
</html>
